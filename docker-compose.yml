# LOCAL DEVELOPMENT ONLY — not a deployment artifact.
# Plain PostgreSQL 16 for Smart Procurement dev (T004); pgvector is NOT required in v1.
# The port is bound to loopback only, and credentials are overridable via the environment
# (defaults are throwaway local values). Do not reuse this file to run anything exposed.
services:
  postgres:
    image: postgres:16
    container_name: smartprocurement-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sp}
      POSTGRES_DB: ${POSTGRES_DB:-smart_procurement}
    ports:
      # host-loopback only — not reachable from other machines on the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sp} -d ${POSTGRES_DB:-smart_procurement}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
